<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AluguelJá - Cadastro de Imóvel</title>
</head>
<body>

    <h1>Cadastro de Imóvel para Locação</h1>

    <form>

        <!-- Seção 1 -->
        <fieldset>
            <legend>Anúncio</legend>

            <label for="titulo">Título do anúncio:</label><br>
            <input 
                type="text" 
                id="titulo" 
                name="titulo"
                maxlength="80"
                placeholder="Ex: Apartamento mobiliado próximo à praia"
                required>
            <br><br>

            <label for="tipo">Tipo de imóvel:</label><br>
            <select id="tipo" name="tipo" required>
                <option value="">Selecione</option>
                <option value="casa">Casa</option>
                <option value="apartamento">Apartamento</option>
                <option value="kitnet">Kitnet</option>
                <option value="sobrado">Sobrado</option>
            </select>
            <br><br>

            <label for="data">Data de disponibilidade:</label><br>
            <input type="date" id="data" name="data">
        </fieldset>

        <br>

        <!-- Seção 2 -->
        <fieldset>
            <legend>Localização</legend>

            <label for="endereco">Endereço completo:</label><br>
            <input 
                type="text" 
                id="endereco" 
                name="endereco"
                placeholder="Rua, número e bairro">
            <br><br>

            <label for="cep">CEP:</label><br>
            <input 
                type="text" 
                id="cep" 
                name="cep"
                pattern="\d{5}-?\d{3}"
                maxlength="9"
                placeholder="00000-000"
                required>
        </fieldset>

        <br>

        <!-- Seção 3 -->
        <fieldset>
            <legend>Características</legend>

            <label for="quartos">Quartos:</label><br>
            <input type="number" id="quartos" name="quartos" min="0">
            <br><br>

            <label for="banheiros">Banheiros:</label><br>
            <input type="number" id="banheiros" name="banheiros" min="0">
            <br><br>

            <label for="area">Área (m²):</label><br>
            <input type="number" id="area" name="area" min="0">
            <br><br>

            <label for="valor">Valor do aluguel:</label><br>
            <input 
                type="number" 
                id="valor" 
                name="valor"
                min="0"
                step="0.01"
                placeholder="0,00">
            <br><br>

            <p>Aceita pets?</p>

            <input type="radio" id="pets-sim" name="pets" value="sim">
            <label for="pets-sim">Sim</label>

            <input type="radio" id="pets-nao" name="pets" value="nao">
            <label for="pets-nao">Não</label>

            <input type="radio" id="pets-negociar" name="pets" value="negociar">
            <label for="pets-negociar">A negociar</label>

            <br><br>

            <p>Comodidades:</p>

            <input type="checkbox" id="wifi" name="comodidades" value="wifi">
            <label for="wifi">Wi-Fi</label><br>

            <input type="checkbox" id="garagem" name="comodidades" value="garagem">
            <label for="garagem">Garagem</label><br>

            <input type="checkbox" id="piscina" name="comodidades" value="piscina">
            <label for="piscina">Piscina</label><br>

            <input type="checkbox" id="academia" name="comodidades" value="academia">
            <label for="academia">Academia</label><br>

            <input type="checkbox" id="ar" name="comodidades" value="ar">
            <label for="ar">Ar-condicionado</label><br>

            <input type="checkbox" id="mobilia" name="comodidades" value="mobilia">
            <label for="mobilia">Mobiliado</label>
        </fieldset>

        <br>

        <!-- Seção 4 -->
        <fieldset>
            <legend>Mídia e Descrição</legend>

            <label for="fotos">Fotos do imóvel:</label><br>
            <input 
                type="file" 
                id="fotos" 
                name="fotos"
                multiple
                accept="image/png, image/jpeg">
            <br><br>

            <label for="descricao">Descrição detalhada:</label><br>
            <textarea 
                id="descricao" 
                name="descricao"
                rows="6"
                cols="50"
                placeholder="Descreva o imóvel..."></textarea>
        </fieldset>

        <br>

        <button type="submit">
            Publicar Anúncio
        </button>

    </form>

</body>
</html>
