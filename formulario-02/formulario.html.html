<!DOCTYPE html>
<html>
    <head lang="pt-br">
        <meta charset="UTF-8">
        <title></title>
        <style>
            h1 {
                font-family: 'Times New Roman', Times, serif;
                color: purple;
            }
            h2 {
                color: red;
                font-size: 15px;
            }
            body {
                max-width: 800px;
                margin: auto;
                margin-bottom: 60px;
            }
            form {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            label {
                display: block;
                margin-top: 6px;
            }
            div {
                display: flex;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Reserva - Sabor do Litoral</h1>
        </header>
        <main>
            <h2>(*) Campos Obrigatórios</h2>
            <form action="https://httpbin.org/post" method="post">
                <fieldset>
                    <legend>Contato</legend>

                    <label for="nome">Nome completo *</label>
                    <input type="text" id="nome" name="nome" required>
    
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(82) 99999-9999" required>

                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>

                </fieldset>
                <fieldset>
                    <legend>Dados da Reserva</legend>

                    <label for="data_reserva">Data e Horário da reserva *</label>
                    <input type="datetime-local" id="data_reserva" name="data_reserva" min="2026-05-19" required>
                    
                    <label for="pessoas">Número de pessoas *</label>
                    <input type="number" id="pessoas" name="pessoas" required min="1" max="20" step="1">

                    <fieldset>
                        <legend>Área preferiada *</legend>

                        <diV>
                            <input type="radio" id="principal" name="local" value="principal" required>
                            <label for="principal">Salão Principal</label>
                        </diV>

                        <diV>
                            <input type="radio" id="externa" name="local" value="externa">
                            <label for="externa">Área Externa</label>
                        </diV>

                        <diV>
                            <input type="radio" id="rooftop" name="local" value="rooftop">
                            <label for="rooftop">RoofTop</label>
                        </diV>
                    </fieldset>

                    <label for="ocasiao">Ocasião *</label>
                    <select id="ocasiao" name="ocasiao" aria-required="true" required>
                        <option>Selecione um Opção</option>
                        <option value="sem_ocasiao">Sem ocasião</option>
                        <option value="aniversario">Aniversário</option>
                        <option value="confraternizacao">Confraternização</option>
                        <option value="casamneto">Casamento</option>
                        <option value="conquista_academica">Conquista Acadêmica</option>
                    </select>

                    <fieldset>
                        <legend>Restrições Alimentares</legend>
    
                        <div>
                            <input type="checkbox" id="amendoim" name="restricoes[]" value="amendoim">
                            <label for="amendoim">Amendoim</label>
                        </div>
    
                        <div>
                            <input type="checkbox" id="leite" name="restricoes[]" value="leite">
                            <label for="leite">Leite</label>
                        </div>
    
                        <div>
                            <input type="checkbox" id="castanhas" name="restricoes[]" value="castanhas">
                            <label for="castanhas">Castanhas</label>
                        </div>
    
                        <div>
                            <input type="checkbox" id="ovos" name="restricoes[]" value="ovos">
                            <label for="ovos">Ovos</label>
                        </div>
    
                        <div>
                            <input type="checkbox" id="soja" name="restricoes[]" value="soja">
                            <label for="soja">Soja</label>
                        </div>
    
                        <div>
                            <input type="checkbox" id="trigo" name="restricoes[]" value="trigo">
                            <label for="trigo">Trigo</label>
                        </div>
    
                        <div>
                            <input type="checkbox" id="peixes" name="restricoes[]" value="peixes">
                            <label for="peixes">Peixe</label>
                        </div>
    
                        <div>
                            <input type="checkbox" id="frutos_mar" name="restricoes" value="frutos_mar">
                            <label for="frutos_mar">Frutos do Mar</label>
                        </div>
                    </fieldset>

                    <label for="observacoes">Observações</label>
                    <textarea id="observacoes" name="observacoes" rows="3"></textarea>
                </fieldset>

                <div>       
                    <label for="aceite">Concordo com os Termos *</label>
                    <input type="checkbox" id="aceite" name="aceite" value="sim" required>
                </div>
                
                <button type="submit">Concluir Reserva</button>
            </form>
        </main>
    </body>
</html>
