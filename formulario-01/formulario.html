<!DOCTYPE html>
<html lang="pt-BR"> 
  <head>
    <body>      
      <h1>Cadastro de Aluno - AlagoasTech EAD</h1>
      <form>          
<fieldset>   
  <legend>Dados Pessoais</legend>  
  <label for="nome">Nome Completo *</label><br>  
   <input type="text" id="nome" name="nome" required>
    <br>
  <br>  
      <label for="cpf">CPF *</label>
  <br>  
   <input  
     type="text"
     id="cpf"
     name="cpf"
     pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
     maxlength="14"
     placeholder="000.000.000-00"
     required>
   <br>
  <br>  
   <label for="nascimento">Data de Nascimento *</label><br>  
   <input type="date" id="nascimento" name="nascimento" required>
   <br><br>              <label for="email">E-mail *</label><br>    
       <input type="email" id="email" name="email" required>             
     <br>
  <br>   
  <label for="telefone">Telefone *</label><br> 
  <input type="tel" id="telefone" name="telefone" required>            
  <br>
  <br>  
     <p>Gênero *</p>  
  <input type="radio" id="masculino" name="genero" required> 
  <label for="masculino">Masculino</label><br>   
  <input type="radio" id="feminino" name="genero">  
  <label for="feminino">Feminino</label><br>        
  <input type="radio" id="naobinario" name="genero">       
  <label for="naobinario">Não Binário</label><br>       
  <input type="radio" id="outro" name="genero">       
  <label for="outro">Outro</label><br><br>         
</fieldset>        
     <fieldset>            
       <legend>Dados Acadêmicos</legend>              
       <label for="curso">Curso de Interesse *</label><br>             
       <select id="curso" name="curso" required>                 
       <option value="">Selecione</option>                 
       <option value="html">HTML e CSS</option>                
       <option value="javascript">JavaScript</option>                 
       <option value="python">Python</option>                
       <option value="bancodedados">Banco de Dados</option>           
</select>          
  <br>             
       <p>Turno Preferido *</p>             
       <input type="checkbox" id="manha" name="turno">            
       <label for="manha">Manhã</label><br>            
       <input type="checkbox" id="tarde" name="turno">           
       <label for="tarde">Tarde</label><br>             
       <input type="checkbox" id="noite" name="turno">           
       <label for="noite">Noite</label><br><br>             
       <label for="foto">Foto de Perfil *</label><br>            
       
       <input                 
         type="file"               
         id="foto"                
         name="foto"               
         accept="image/*"               
         required>            
     <br>
       <br>             
       <label for="apresentacao">Apresentação Pessoal *</label><br>    
       <textarea              
       id="apresentacao"             
       name="apresentacao"              
       rows="5"               
       cols="40"              
       required>
         
       </textarea>     
       <br><br>        
        </fieldset>  
        
        <fieldset>         
          <legend>Acesso</legend>        
          <label for="senha">Senha *</label><br>        
      <input               
        type="password"              
        id="senha"                 
        name="senha"               
        minlength="8"               
        required>            
    <br><br>          
          <label for="confirmarsenha">Confirmar Senha *</label>
    <br>  
          <input     
          type="password"     
          id="confirmarsenha"          
          name="confirmarsenha"        
          minlength="8"            
          required>            
          <br><br>            
          <input type="checkbox" id="termos" name="termos" required> 
          <label for="termos">           
                     
          </label>           
    <br><br>     
        </fieldset>         
        <button type="reset">Limpar</button>     
        <button type="submit">Criar Conta</button>   
      
      </form> 
    </body>
</html>
